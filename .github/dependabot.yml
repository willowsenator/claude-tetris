version: 2

# The triage workflow pins both actions to commit SHAs, which a mutable tag cannot outrun — and
# which nothing moves on its own. This is what moves them: Dependabot rewrites the pinned SHA and
# keeps the trailing version comment in sync.
#
# github-actions is the only ecosystem here, and the only one that can be: the game itself has no
# package manager and no dependencies, which is a stated property of the project.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One pull request for all action bumps rather than one per action.
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
